{
  "version": "1.0.0",
  "note": "特征注册表。source=入参来自 stock_daily 的哪些字段；stat=统计口径（窗口/预热/缺失处理）。前端「公式说明」弹窗与引擎共用这份口径描述。",
  "groups": [
    { "id": "ret", "label": "收益", "desc": "同一前复权快照内的对数收益，停牌日不参与" },
    { "id": "z", "label": "Z-Score", "desc": "相对自身过去 20 个有效交易日的均值/标准差" },
    { "id": "trend", "label": "趋势", "desc": "均线乖离、排列与 MACD(12,26,9)" },
    { "id": "osc", "label": "超买超卖", "desc": "RSI14 与近 20/60 日高低点位置" },
    { "id": "vol", "label": "波动", "desc": "ATR14、已实现波动率、振幅" },
    { "id": "amount", "label": "量能", "desc": "成交量/额相对 20 日均量、换手率" },
    { "id": "streak", "label": "连续状态", "desc": "连涨连跌、涨跌停次数" },
    { "id": "value", "label": "估值", "desc": "估值指标在自身窗口内的历史分位，非正/缺失不填 0" },
    { "id": "market", "label": "市场联动", "desc": "market proxy = 股票池当日等权收益，来自 stock_daily 自身" },
    { "id": "cross", "label": "横截面", "desc": "当日全市场分位排名与 z 值，使跨股票可比" },
    { "id": "signal", "label": "离散信号", "desc": "M1 贝叶斯用的布尔信号，由上面特征离散化得到" }
  ],
  "features": [
    { "name": "ret_1", "group": "ret", "cn": "1 日对数收益", "formula": "r_t = ln(C_t / C_{t-1})", "lookback": 1, "missing": "drop", "source": "close（前复权）", "stat": "同一次读取的前复权快照；停牌日剔除后相邻有效交易日求比值；pct_chg 仅用于交叉校验" },
    { "name": "ret_3", "group": "ret", "cn": "3 日对数收益", "formula": "ln(C_t / C_{t-3})", "lookback": 3, "missing": "drop", "source": "close", "stat": "有效交易日序列上回看 3 行" },
    { "name": "ret_5", "group": "ret", "cn": "5 日对数收益", "formula": "ln(C_t / C_{t-5})", "lookback": 5, "missing": "drop", "source": "close", "stat": "有效交易日序列上回看 5 行" },
    { "name": "ret_10", "group": "ret", "cn": "10 日对数收益", "formula": "ln(C_t / C_{t-10})", "lookback": 10, "missing": "drop", "source": "close", "stat": "有效交易日序列上回看 10 行" },
    { "name": "ret_20", "group": "ret", "cn": "20 日对数收益", "formula": "ln(C_t / C_{t-20})", "lookback": 20, "missing": "drop", "source": "close", "stat": "有效交易日序列上回看 20 行" },
    { "name": "z_ret_1", "group": "z", "cn": "日收益 Z 值", "formula": "Z = (X - mu_20) / sigma_20", "lookback": 20, "missing": "median", "source": "close 派生的 r_t", "stat": "mu/sigma 用过去 20 个有效交易日的 r_t，样本标准差 ddof=1；sigma=0 时记缺失" },
    { "name": "z_volume_20", "group": "z", "cn": "成交量 Z 值", "formula": "Z = (volume_t - mu_20) / sigma_20", "lookback": 20, "missing": "median", "source": "volume", "stat": "过去 20 个有效交易日成交量均值/标准差" },
    { "name": "z_turnover_20", "group": "z", "cn": "换手率 Z 值", "formula": "Z = (turnover_t - mu_20) / sigma_20", "lookback": 20, "missing": "median", "source": "turnover（百分数÷100）", "stat": "入口统一把百分数除以 100 转小数" },
    { "name": "z_amplitude_20", "group": "z", "cn": "振幅 Z 值", "formula": "Z = (amplitude_t - mu_20) / sigma_20", "lookback": 20, "missing": "median", "source": "amplitude（百分数÷100）", "stat": "入口统一把百分数除以 100 转小数" },
    { "name": "bias_ma5", "group": "trend", "cn": "MA5 乖离", "formula": "C_t / MA5_t - 1", "lookback": 5, "missing": "median", "source": "close", "stat": "MA 用有效交易日收盘价的简单移动平均" },
    { "name": "bias_ma10", "group": "trend", "cn": "MA10 乖离", "formula": "C_t / MA10_t - 1", "lookback": 10, "missing": "median", "source": "close", "stat": "同上" },
    { "name": "bias_ma20", "group": "trend", "cn": "MA20 乖离", "formula": "C_t / MA20_t - 1", "lookback": 20, "missing": "median", "source": "close", "stat": "同上" },
    { "name": "bias_ma60", "group": "trend", "cn": "MA60 乖离", "formula": "C_t / MA60_t - 1", "lookback": 60, "missing": "median", "source": "close", "stat": "预热 60 日，前 59 行记缺失" },
    { "name": "ma_bull", "group": "trend", "cn": "均线多头排列", "formula": "1[MA5 > MA10 > MA20 > MA60]", "lookback": 60, "missing": "zero", "source": "close", "stat": "布尔标志，缺失视为 0" },
    { "name": "macd_dif", "group": "trend", "cn": "MACD DIF", "formula": "EMA12(C) - EMA26(C)", "lookback": 26, "missing": "median", "source": "close", "stat": "EMA 递推 ewm(span=12/26, adjust=False)，不用 center" },
    { "name": "macd_dea", "group": "trend", "cn": "MACD DEA", "formula": "EMA9(DIF)", "lookback": 35, "missing": "median", "source": "close 派生的 DIF", "stat": "对 DIF 再做 EMA9" },
    { "name": "macd_hist", "group": "trend", "cn": "MACD 柱", "formula": "2 * (DIF - DEA)", "lookback": 35, "missing": "median", "source": "close", "stat": "常用口径柱值放大 2 倍" },
    { "name": "macd_gold", "group": "trend", "cn": "MACD 金叉", "formula": "1[DIF_t > DEA_t 且 DIF_{t-1} <= DEA_{t-1}]", "lookback": 35, "missing": "zero", "source": "macd_dif, macd_dea", "stat": "当日穿越标志" },
    { "name": "macd_dead", "group": "trend", "cn": "MACD 死叉", "formula": "1[DIF_t < DEA_t 且 DIF_{t-1} >= DEA_{t-1}]", "lookback": 35, "missing": "zero", "source": "macd_dif, macd_dea", "stat": "当日穿越标志" },
    { "name": "rsi_14", "group": "osc", "cn": "RSI14", "formula": "100 * SMA(gain,14) / (SMA(gain,14) + SMA(loss,14))", "lookback": 14, "missing": "median", "source": "close 派生的涨跌额", "stat": "Wilder 平滑 ewm(alpha=1/14)；跌幅取绝对值，分母为 0 时记 50" },
    { "name": "pos_high20", "group": "osc", "cn": "距 20 日高点位置", "formula": "(C_t - LLV20) / (HHV20 - LLV20)", "lookback": 20, "missing": "median", "source": "high, low, close", "stat": "HHV/LLV 含当日，区间为 0 时记 0.5" },
    { "name": "pos_low20", "group": "osc", "cn": "距 20 日低点位置", "formula": "1 - (C_t - LLV20) / (HHV20 - LLV20)", "lookback": 20, "missing": "median", "source": "high, low, close", "stat": "与 pos_high20 互补" },
    { "name": "pos_high60", "group": "osc", "cn": "距 60 日高点位置", "formula": "(C_t - LLV60) / (HHV60 - LLV60)", "lookback": 60, "missing": "median", "source": "high, low, close", "stat": "预热 60 日" },
    { "name": "pos_low60", "group": "osc", "cn": "距 60 日低点位置", "formula": "1 - pos_high60", "lookback": 60, "missing": "median", "source": "high, low, close", "stat": "与 pos_high60 互补" },
    { "name": "atr14_ratio", "group": "vol", "cn": "ATR14 / 收盘价", "formula": "ATR14 / C_t，TR=max(H-L, |H-C_{t-1}|, |L-C_{t-1}|)", "lookback": 14, "missing": "median", "source": "high, low, close", "stat": "Wilder 平滑 ATR；除以当日收盘价消除价格量纲" },
    { "name": "vol_20", "group": "vol", "cn": "20 日已实现波动", "formula": "std(r_{t-19..t}) * sqrt(244)", "lookback": 20, "missing": "median", "source": "close 派生的 r_t", "stat": "日对数收益样本标准差年化（年交易日数可配置 244）" },
    { "name": "vol_60", "group": "vol", "cn": "60 日已实现波动", "formula": "std(r_{t-59..t}) * sqrt(244)", "lookback": 60, "missing": "median", "source": "close 派生的 r_t", "stat": "同上，窗口 60" },
    { "name": "amplitude_ma20", "group": "vol", "cn": "20 日平均振幅", "formula": "mean(amplitude_{t-19..t} / 100)", "lookback": 20, "missing": "median", "source": "amplitude", "stat": "百分数÷100 后取 20 日均值" },
    { "name": "vol_ratio_20", "group": "amount", "cn": "量比", "formula": "volume_t / mean(volume_{t-20..t-1})", "lookback": 20, "missing": "median", "source": "volume", "stat": "分母用过去 20 日（不含当日）均量，避免自身稀释" },
    { "name": "amount_ratio_20", "group": "amount", "cn": "额比", "formula": "amount_t / mean(amount_{t-20..t-1})", "lookback": 20, "missing": "median", "source": "amount", "stat": "同量比" },
    { "name": "turnover_ma5", "group": "amount", "cn": "5 日平均换手", "formula": "mean(turnover_{t-4..t} / 100)", "lookback": 5, "missing": "median", "source": "turnover", "stat": "百分数÷100 后取 5 日均值" },
    { "name": "up_streak", "group": "streak", "cn": "连涨天数", "formula": "连续 r_t > 0 的交易日数", "lookback": 20, "missing": "zero", "source": "close 派生的 r_t", "stat": "在有效交易日序列上累计，最多统计 20 日" },
    { "name": "down_streak", "group": "streak", "cn": "连跌天数", "formula": "连续 r_t < 0 的交易日数", "lookback": 20, "missing": "zero", "source": "close 派生的 r_t", "stat": "同上" },
    { "name": "limit_up_cnt_20", "group": "streak", "cn": "20 日涨停次数", "formula": "sum(1[pct_chg >= L-eps 且 close == high])", "lookback": 20, "missing": "zero", "source": "pct_chg, close, high, code, is_st", "stat": "涨跌停幅度 L 按板块（主板/创业板/ST）从 config.limit_pct 读取" },
    { "name": "limit_dn_cnt_20", "group": "streak", "cn": "20 日跌停次数", "formula": "sum(1[pct_chg <= -L+eps 且 close == low])", "lookback": 20, "missing": "zero", "source": "pct_chg, close, low, code, is_st", "stat": "同上" },
    { "name": "pe_pctile", "group": "value", "cn": "PE 历史分位", "formula": "rank(pe_ttm_t) / n_valid", "lookback": 250, "missing": "flag", "source": "pe_ttm", "stat": "pe_ttm<=0 或空视为缺失、不填 0；在自身窗口内有效值的升序百分位排名，保留缺失标志" },
    { "name": "pb_pctile", "group": "value", "cn": "PB 历史分位", "formula": "rank(pb_mrq_t) / n_valid", "lookback": 250, "missing": "flag", "source": "pb_mrq", "stat": "同上" },
    { "name": "ps_pctile", "group": "value", "cn": "PS 历史分位", "formula": "rank(ps_ttm_t) / n_valid", "lookback": 250, "missing": "flag", "source": "ps_ttm", "stat": "同上" },
    { "name": "market_ret_1", "group": "market", "cn": "市场当日收益", "formula": "mean_i(r_{i,t})（等权）", "lookback": 1, "missing": "median", "source": "股票池全部个股 r_t", "stat": "market proxy；可配置为成交额加权；只用当日截面，无未来数据" },
    { "name": "market_ret_5", "group": "market", "cn": "市场 5 日收益", "formula": "sum_{k=0..4} mean_i(r_{i,t-k})", "lookback": 5, "missing": "median", "source": "股票池全部个股 r_t", "stat": "逐日等权收益累加" },
    { "name": "excess_ret_1", "group": "market", "cn": "个股超额收益", "formula": "r_{i,t} - market_ret_1_t", "lookback": 1, "missing": "median", "source": "r_t 与 market proxy", "stat": "同日相减" },
    { "name": "corr_60", "group": "market", "cn": "60 日市场相关系数", "formula": "Cov(r_i, r_m) / (sigma_i * sigma_m)", "lookback": 60, "missing": "median", "source": "r_t 与 market proxy", "stat": "过去 60 个有效交易日配对样本；任一标准差为 0 记缺失" },
    { "name": "beta_60", "group": "market", "cn": "60 日 Beta", "formula": "Cov(r_i, r_m) / Var(r_m)", "lookback": 60, "missing": "median", "source": "r_t 与 market proxy", "stat": "过去 60 日配对样本" },
    { "name": "cs_rank_ret_5", "group": "cross", "cn": "5 日收益横截面排名", "formula": "rank_pct(ret_5) over 当日全部股票", "lookback": 1, "missing": "median", "source": "ret_5 当日截面", "stat": "按当日全市场升序百分位排名（0~1）；只用当日已算出的特征，无未来数据" },
    { "name": "cs_z_ret_5", "group": "cross", "cn": "5 日收益横截面 Z", "formula": "(ret_5 - mean_all) / std_all", "lookback": 1, "missing": "zero", "source": "ret_5 当日截面", "stat": "当日截面均值/标准差，winsorize 后在训练期统计" },
    { "name": "cs_rank_vol_20", "group": "cross", "cn": "波动横截面排名", "formula": "rank_pct(vol_20) over 当日全部股票", "lookback": 1, "missing": "median", "source": "vol_20 当日截面", "stat": "同上" },
    { "name": "cs_rank_rsi14", "group": "cross", "cn": "RSI 横截面排名", "formula": "rank_pct(rsi_14) over 当日全部股票", "lookback": 1, "missing": "median", "source": "rsi_14 当日截面", "stat": "同上" },
    { "name": "cs_rank_vol_ratio_20", "group": "cross", "cn": "量比横截面排名", "formula": "rank_pct(vol_ratio_20) over 当日全部股票", "lookback": 1, "missing": "median", "source": "vol_ratio_20 当日截面", "stat": "同上" },
    { "name": "cs_rank_bias_20", "group": "cross", "cn": "MA20 乖离横截面排名", "formula": "rank_pct(bias_ma20) over 当日全部股票", "lookback": 1, "missing": "median", "source": "bias_ma20 当日截面", "stat": "同上" },
    { "name": "cs_rank_pe_pctile", "group": "cross", "cn": "PE 分位横截面排名", "formula": "rank_pct(pe_pctile) over 当日全部股票", "lookback": 1, "missing": "median", "source": "pe_pctile 当日截面", "stat": "同上" }
  ],
  "signals": [
    { "key": "sig_macd_gold", "cn": "MACD 金叉", "expr": "macd_gold == 1", "source": "macd_dif/macd_dea" },
    { "key": "sig_macd_dead", "cn": "MACD 死叉", "expr": "macd_dead == 1", "source": "macd_dif/macd_dea" },
    { "key": "sig_rsi_low", "cn": "RSI14<30", "expr": "rsi_14 < 30", "source": "rsi_14" },
    { "key": "sig_rsi_high", "cn": "RSI14>70", "expr": "rsi_14 > 70", "source": "rsi_14" },
    { "key": "sig_vol_spike", "cn": "量比>2", "expr": "vol_ratio_20 > 2", "source": "vol_ratio_20" },
    { "key": "sig_ma_bull", "cn": "均线多头排列", "expr": "ma_bull == 1", "source": "ma_bull" },
    { "key": "sig_down3", "cn": "连跌≥3日", "expr": "down_streak >= 3", "source": "down_streak" },
    { "key": "sig_up3", "cn": "连涨≥3日", "expr": "up_streak >= 3", "source": "up_streak" },
    { "key": "sig_limit_up", "cn": "近20日有涨停", "expr": "limit_up_cnt_20 > 0", "source": "limit_up_cnt_20" },
    { "key": "sig_z_pos", "cn": "日收益 z>2", "expr": "z_ret_1 > 2", "source": "z_ret_1" },
    { "key": "sig_z_neg", "cn": "日收益 z<-2", "expr": "z_ret_1 < -2", "source": "z_ret_1" },
    { "key": "sig_mkt_up", "cn": "market_ret_1>0", "expr": "market_ret_1 > 0", "source": "market_ret_1" }
  ]
}
